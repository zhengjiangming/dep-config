# =====================================================================
#  Default values for the whole deployment.
#  Read by conf\env.bat BEFORE conf\deploy.properties, so a value written
#  in deploy.properties (by install.bat or Setup.exe) always wins.
#  A blank value means "derive at runtime", see the notes below.
# =====================================================================

DEPLOY_HOST=127.0.0.1
INFRA_JDK=17

# ---------- ports / accounts ----------
MYSQL_PORT=3306
MYSQL_USER=root
MYSQL_PWD=
# Windows service name registered by bin\0-init.bat for the bundled MySQL.
# Start scripts prefer it, then any other mysqld.exe service on the machine.
MYSQL_SERVICE_NAME=batapp-mysql
REDIS_SERVICE_NAME=redis-server
# MinIO / RocketMQ / Nacos Windows service names registered by the
# bin\install-*.bat WinSW wrappers. Start scripts prefer these names.
MINIO_SERVICE_NAME=minio
MQ_SERVICE_NAME=rocketmq-namesrv
NACOS_SERVICE_NAME=nacos
NGINX_SERVICE_NAME=nginx
PG_PORT=5432
PG_USER=postgres
PG_PWD=
REDIS_PORT=6379
REDIS_PWD=
MINIO_PORT=9000
MINIO_CONSOLE_PORT=9001
MINIO_USER=minioadmin
MINIO_PWD=
MQ_NAMESRV_PORT=9876
MQ_BROKER_PORT=10911
MQ_HA_PORT=10912
NACOS_PORT=8848
NACOS_NAMESPACE=prod
NACOS_GROUP=DEFAULT_GROUP
NACOS_PROFILE=prod
NACOS_USER=
NACOS_PWD=
GEOSERVER_PORT=8080
NGINX_PORT=80

# ---------- components started on this machine (1 local / 0 remote) ----------
START_MYSQL=1
START_PG=1
START_REDIS=1
START_MINIO=1
START_MQ=1
START_NACOS=1
START_GEOSERVER=1
START_NGINX=1

# ---------- directories ----------
# blank = APP_HOME\data, APP_HOME\logs and data\<component>
DATA_DIR=
LOG_DIR=
MYSQL_DATA_DIR=
PG_DATA_DIR=
MQ_DATA_DIR=
MINIO_DATA_DIR=
GEOSERVER_DATA_DIR=
NODE_OUT_DIR=

# ---------- config files ----------
# blank = file inside the bundled component directory
MYSQL_CNF=
REDIS_CNF=
MQ_BROKER_CNF=
NGINX_CONF=
NACOS_CONF_DIR=
CURL_EXE=
VCREDIST_EXE=
POWERSHELL_EXE=
FIREWALL_RULE_NAME=bat_application

# ---------- port wait timeouts (seconds) ----------
WAIT_MYSQL_SEC=90
WAIT_PG_SEC=60
WAIT_REDIS_SEC=30
WAIT_MINIO_SEC=30
WAIT_MQ_NS_SEC=60
WAIT_MQ_BROKER_SEC=90
WAIT_NACOS_SEC=180
WAIT_GEOSERVER_SEC=180
WAIT_NGINX_SEC=30
WAIT_APP_SEC=180
WAIT_NACOS_HTTP_SEC=180
HTTP_TIMEOUT_SEC=3
IMPORT_TIMEOUT_SEC=20
# Setup.exe 执行安装脚本的最长等待时间，超时强制结束，避免界面无限停在“执行中”
SCRIPT_TIMEOUT_SEC=1800

# ---------- JVM ----------
# blank = built-in default string from conf\env.bat
JVM_BASE=
JDK17_OPENS=
NACOS_JVM_XMS=512m
NACOS_JVM_XMX=512m
NACOS_JVM_XMN=256m
NACOS_JAVA_TOOL_OPTIONS=
NACOS_EXTRA_OPTS=

# ---------- runtime ----------
KILL_PROC_LIST=java.exe javaw.exe nginx.exe mysqld.exe postgres.exe redis-server.exe minio.exe
