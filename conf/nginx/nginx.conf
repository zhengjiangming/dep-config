worker_processes  1;

error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 100m;

    # Addresses below use ${...} placeholders.
    # After editing, open Setup.exe -> Nginx config -> "Inject variables" then "Save and reload".
    server {
        listen       ${NGINX_PORT};
        server_name  ${NGINX_HOST};

        # MapServer
        location / {
            proxy_pass http://${DEPLOY_HOST}:8094;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Example: expose service svc01 under /svc01/
        # location /svc01/ {
        #     proxy_pass http://${DEPLOY_HOST}:8081/;
        # }
    }
}
