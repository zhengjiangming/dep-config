# =====================================================================
#  RocketMQ broker template.
#  bin\2-start-infra.bat and bin\9-infra.bat render it to
#  MQ_BROKER_RUN_CNF (default <ROCKETMQ_HOME>\conf\broker.run.conf).
#  Supported placeholders: ${MQ_BROKER_PORT} ${MQ_HA_PORT} ${MQ_DATA_DIR}
# =====================================================================

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
listenPort = ${MQ_BROKER_PORT}
haListenPort = ${MQ_HA_PORT}
storePathRootDir = ${MQ_DATA_DIR}
