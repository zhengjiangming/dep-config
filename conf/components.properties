# =====================================================================
#  Component locations (dev / assemble machine only).
#  Leave a key commented or blank to use the bundled folder:
#    runtime\jdk17  runtime\jdk21
#    infra\mysql  infra\postgres  infra\redis  infra\rocketmq
#    infra\minio  infra\nacos  infra\geoserver
#
#  Runtime reads these directly (start/stop/status use the configured path).
#  assemble.bat copies only the entries written here into the package layout
#  before pack.bat runs; system environment variables are not used by assemble.
#  Paths must NOT contain spaces.
# =====================================================================

# JDK17_HOME=D:\soft\jdk-17
# JDK21_HOME=D:\soft\jdk-21

# MYSQL_HOME=D:\soft\mysql-8.0.40-winx64
# PG_HOME=D:\soft\postgresql-16
# REDIS_HOME=D:\soft\redis
# ROCKETMQ_HOME=D:\soft\rocketmq-all-5.3.1-bin-release
# MINIO_HOME=D:\soft\minio
# NACOS_HOME=D:\soft\nacos
# GEOSERVER_HOME=D:\soft\geoserver
# NGINX_HOME=D:\soft\nginx-1.24

# Used by assemble.bat only; runtime jars are always read from apps\ and engine\
# APPS_DIR=D:\build\dist\apps
# ENGINE_JAR=D:\build\dist\qrule.jar
