# Post-install steps, executed in file order by install.bat and Setup.exe.
# name|script|default(1/0)|stop_on_fail(1/0)|description
# script is relative to the install directory; "auto" is passed automatically.
VC++ runtime|bin\11-vcredist.bat|1|0|VC++ 2015-2022 x64 runtime for MySQL/PG/MinIO
Init data dirs|bin\0-init.bat|1|1|Initialize MySQL and PostgreSQL data directories
Register Redis service|bin\install-redis.bat|1|0|Register auto-start Redis service (redis-server)
Register MinIO service|bin\install-minio.bat|1|0|Register auto-start MinIO service (minio)
Register RocketMQ services|bin\install-rocketmq.bat|1|0|Register auto-start RocketMQ services (namesrv+broker)
Register Nacos service|bin\install-nacos.bat|1|0|Register auto-start Nacos service (nacos, standalone)
Firewall rules|bin\10-firewall.bat|1|0|Open configured component and service ports
Start infrastructure|bin\2-start-infra.bat|0|1|Start middleware in dependency order
Import Nacos configs|bin\5-import-config.bat|0|1|Publish conf\nacos files to Nacos
Start services|bin\3-start-apps.bat|0|1|Start services assigned to this host
Reload Nginx|bin\7-reload-nginx.bat|0|1|Render placeholders and reload Nginx
Self check|bin\1-check.bat|0|0|Print a full deployment check
